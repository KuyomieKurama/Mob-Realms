name: Build and core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/check_resources.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/install-server.sh scripts/start-server.sh scripts/upgrade-server.sh
      - run: ./gradlew --no-daemon build
      - name: Dedicated server bootstrap (no world or EULA acceptance)
        run: ./gradlew --no-daemon :fabric-mod:runServer --args=--initSettings
      - name: Install a real server and check dependencies without starting a world
        run: |
          # Exercise automatic Java provisioning despite the runner's preinstalled JDK.
          mkdir -p "$RUNNER_TEMP/old-java-bin"
          printf '#!/bin/sh\nprintf "java.specification.version = 21\\n" >&2\n' > "$RUNNER_TEMP/old-java-bin/java"
          chmod +x "$RUNNER_TEMP/old-java-bin/java"
          unset JAVA_HOME JAVA_BIN
          export PATH="$RUNNER_TEMP/old-java-bin:$PATH"
          export XDG_DATA_HOME="$RUNNER_TEMP/mobrealms-java-data"
          ./scripts/install-server.sh --dir "$RUNNER_TEMP/mob realms server" --mod fabric-mod/build/libs/mob-realms-0.6.2-dev.jar --xms 512M --xmx 1G
          "$RUNNER_TEMP/mob realms server/start-server.sh" --check
          ./scripts/install-server.sh --dir "$RUNNER_TEMP/mob realms server" --mod fabric-mod/build/libs/mob-realms-0.6.2-dev.jar --xms 512M --xmx 1G
      - uses: actions/upload-artifact@v4
        with:
          name: mob-realms-development
          path: fabric-mod/build/libs/*.jar
