plugins { id 'base' }
allprojects {
    group = rootProject.group
    version = rootProject.version
}
subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
    }
}
tasks.named('build') { dependsOn ':sim-core:build', ':fabric-mod:build' }
tasks.register('runClient') { dependsOn ':fabric-mod:runClient' }
tasks.register('runServer') { dependsOn ':fabric-mod:runServer' }
tasks.register('test') { dependsOn ':sim-core:coreTest' }
